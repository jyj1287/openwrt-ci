name: RM1800-256-EXPERIMENTAL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rm1800-experimental
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      SOURCE_REPO: https://github.com/LiBwrt/openwrt-6.x.git
      SOURCE_COMMIT: a151272502f075bfc5b708e8e696870aa2c48868
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl libelf-dev time xsltproc \
            liblzma-dev patch subversion zip zstd device-tree-compiler
          # These are disposable, preinstalled SDK folders on this hosted runner.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Fetch pinned source
        run: |
          git init openwrt
          git -C openwrt remote add origin "$SOURCE_REPO"
          git -C openwrt fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Apply RM1800 experiment
        run: python3 scripts/prepare-rm1800.py openwrt
      - name: Install feeds and configure
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../configs/rm1800-256-experimental.config .config
          make defconfig
          grep -qx CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_xiaomi_ax1800=y .config
          grep -qx CONFIG_ATH11K_MEM_PROFILE_256M=y .config
          ! grep -qx CONFIG_ATH11K_MEM_PROFILE_512M=y .config
          mkdir -p ../build-report
          cp .config ../build-report/build.config
          git diff > ../build-report/source.patch
          git rev-parse HEAD > ../build-report/source-commit.txt
          ./scripts/feeds list -s > ../build-report/feeds.txt
      - name: Download sources
        working-directory: openwrt
        run: make download -j4
      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee ../build-report/build.log
      - name: Check and collect images
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, shutil
          configs = list(pathlib.Path('openwrt/build_dir').glob('target-*/linux-qualcommax_ipq60xx/linux-6.12*/.config'))
          assert len(configs) == 1, 'Cannot uniquely locate target kernel config'
          config = configs[0].read_text().splitlines()
          for required in ('CONFIG_CMA=y', 'CONFIG_DMA_CMA=y', 'CONFIG_CMA_SIZE_MBYTES=8'):
              assert required in config, 'Kernel rejected requested DMA pool option: '+required
          out = pathlib.Path('build-report/firmware')
          out.mkdir()
          images = list(pathlib.Path('openwrt/bin/targets/qualcommax/ipq60xx').glob('*xiaomi_ax1800*'))
          assert images, 'No AX1800 output images'
          for image in images:
              if image.suffix in ('.ubi', '.bin', '.itb'):
                  assert image.stat().st_size < 72 * 1024 * 1024, f'Oversize image: {image}'
              if image.is_file():
                  shutil.copy2(image, out / image.name)
          (out/'SHA256SUMS').write_text(''.join(
              hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n'
              for p in sorted(out.iterdir()) if p.is_file()))
          PY
          cp openwrt/bin/targets/qualcommax/ipq60xx/*buildinfo build-report/ || true
          find openwrt/build_dir -path '*/ath11k/hw.h' -exec cp --parents '{}' build-report/ \;
          find openwrt/build_dir -name .config -path '*linux*' -exec cp --parents '{}' build-report/ \;
          cp RM1800-EXPERIMENT.md build-report/
      - name: Upload firmware and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RM1800-256-experimental-${{ github.run_number }}
          path: build-report/
          if-no-files-found: warn
          retention-days: 14
